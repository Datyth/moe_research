experiment:
  name: teacher_clean_isic2018
  output_root: runs

seed: 42

dataset:
  name: isic2018_mask_only
  root: /home/teama/projects/project_01/dataset/isic2018_task1
  manifest: manifests/isic2018_task1_v1.json
  version: isic2018-task1-v1
  task: binary
  num_classes: 1
  in_channels: 3
  image_size: [256, 256]
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  mask_threshold: 0.5
  foreground_threshold: 0.0
  allow_non_binary_source: false

model:
  name: shape_teacher
  mask_channels: 1
  encoder_channels: [32, 64, 128, 256]
  feature_dim: 256
  latent_dim: 128
  decoder_channels: [128, 64, 32, 16]
  sigma_floor: 0.0001

loss:
  name: shape_teacher
  lambda_bce: 1.0
  lambda_dice: 1.0
  dice_epsilon: 0.000001

optimizer:
  name: adamw
  lr: 0.0003
  weight_decay: 0.00001

scheduler:
  name: cosine
  eta_min: 0.0

training:
  input_mode: clean
  epochs: 150
  batch_size: 32
  num_workers: 4
  device: cuda
  amp: true
  warmup_epochs: 5
  # Disabled so clean and denoise complete exactly the same number of steps.
  early_stopping_patience: 0
  prediction_threshold: 0.5
  boundary_tolerance: 2
  log_interval: 20
  gradient_clip_norm: 5.0
  selection_metric: val_clean_dice

corruption:
  enabled: false
  training:
    operation_count: [1, 3]
    probabilities: &probabilities
      erosion: 0.35
      dilation: 0.35
      random_holes: 0.25
      blob_removal: 0.20
      boundary_jitter: 0.25
    morphology_radius: [1, 5]
    hole_count: [1, 5]
    hole_radius: [2, 10]
    blob_count: [1, 3]
    blob_radius: [3, 12]
    translate: 4
    scale: [0.95, 1.05]
    rotate: 10
  evaluation:
    operation_count: [1, 2]
    probabilities: *probabilities
    morphology_radius: [1, 3]
    hole_count: [1, 3]
    hole_radius: [2, 6]
    blob_count: [1, 2]
    blob_radius: [3, 7]
    translate: 2
    scale: [0.98, 1.02]
    rotate: 5
