# Fast 1-epoch sanity check before a long run. Exercises the full E3
# architecture (MoE-FEB + LPEG); the LR scheduler is disabled so the check
# is about the model and data path, not the schedule.
extends: amos22_common.yaml

experiment:
  name: amos22_smoke
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: true
  use_lpeg: true
  moe_num_experts: 4
  moe_top_k_ratio: 0.5
  freeze_backbone: true

scheduler:
  name: none

training:
  epochs: 1
  batch_size: 4
  num_workers: 4
  gradient_clip_norm: null
