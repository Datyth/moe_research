# E3: Full MoE-SAM — SAM + Adapter + MoE-FEB + LPEG (paper's best model).
# Ablation row of paper Table 2 (both components on).
extends: isic2018_common.yaml

experiment:
  name: isic2018_e3
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: true
  use_lpeg: true
  moe_num_experts: 4
  moe_top_k_ratio: 0.5
  freeze_backbone: true

scheduler:
  # Paper-released recipe: 250-iteration linear warmup + polynomial decay 0.9.
  name: warmup_poly
  warmup_steps: 250
  power: 0.9
