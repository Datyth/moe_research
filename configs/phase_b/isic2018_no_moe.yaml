# Controlled Phase B ablation: multi-level residual enhancement without MoE.
extends: ../isic2018_common.yaml

experiment:
  name: phase_b_isic2018_no_moe
  output_root: runs

model:
  name: phase_b_no_moe
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: false
  use_lpeg: true
  freeze_backbone: true
  descriptor_dim: 256
  levels: [3, 6, 9, 12]
  scoring_hidden_dim: 64

task:
  name: segmentation

scheduler:
  name: warmup_poly
  warmup_steps: 250
  power: 0.9
