# E0: SAM + Adapter, no MoE and no LPEG, on Synapse/BTCV CT. Same as
# synapse_e1.yaml but use_moe: false — isolates the MoE's contribution, same as
# isic2018_e0.yaml. `use_lpeg: false` must be stated explicitly: EsamModel
# defaults it to True.
extends: synapse_common.yaml

experiment:
  name: synapse_e0
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: false
  use_lpeg: false
  freeze_backbone: true
