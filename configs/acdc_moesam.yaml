# Full MoE-SAM on ACDC: SAM + Adapter + MoE-FEB + LPEG.
# Mirrors configs/isic2018_e3.yaml while inheriting the ACDC multiclass recipe.
extends: acdc_common.yaml

experiment:
  name: acdc_moesam
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: true
  use_lpeg: true
  moe_num_experts: 4
  moe_top_k_ratio: 0.5
  freeze_backbone: true
