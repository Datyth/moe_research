# E1: MoE only — SAM + Adapter + MoE-FEB (no LPEG) on Synapse/BTCV CT. Same
# architecture as isic2018_e1.yaml / amos22_e1.yaml — only the dataset block
# (via synapse_common.yaml) differs.
extends: synapse_common.yaml

experiment:
  name: synapse_e1
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: true
  use_lpeg: false
  moe_num_experts: 4
  moe_top_k_ratio: 0.5
  freeze_backbone: true
