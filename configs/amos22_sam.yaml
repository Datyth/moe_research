# Promptless SAM baseline on AMOS22 CT: plain ViT-B encoder and a trainable
# semantic mask decoder, with no Adapter, MoE, LPEG, or external prompts.
extends: amos22_common.yaml

experiment:
  name: amos22_sam
  output_root: runs

model:
  name: sam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  freeze_image_encoder: true
  freeze_prompt_encoder: true
