# Fast 1-epoch sanity check before a long run.
extends: synapse_common.yaml

experiment:
  name: synapse_smoke
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: false
  freeze_backbone: true

scheduler:
  name: none

training:
  epochs: 1
  batch_size: 4
  num_workers: 4
  gradient_clip_norm: null
  early_stopping_patience: null
