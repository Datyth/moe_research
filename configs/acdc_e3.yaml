# E3: Full MoE-SAM — SAM + Adapter + MoE-FEB + LPEG (paper's best model) on ACDC.
# Same ablation row as isic2018_e3.yaml / amos22_e3.yaml / synapse_e3.yaml.
# Replaces the former configs/acdc_moesam.yaml (identical settings, renamed so
# every dataset uses one acdc_e0..e3 naming scheme).
extends: acdc_common.yaml

experiment:
  name: acdc_e3
  output_root: runs

model:
  name: esam
  image_size: 256
  checkpoint: checkpoints/sam_vit_b_01ec64.pth
  use_moe: true
  use_lpeg: true
  moe_num_experts: 4
  moe_top_k_ratio: 0.5
  freeze_backbone: true
